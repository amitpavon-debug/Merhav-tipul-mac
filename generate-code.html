<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מרחב הטיפול — יצירת קוד הפעלה</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Heebo',sans-serif;background:#f7f3ee;color:#2c1f14;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:2rem;}
.card{background:#fff;border:1px solid rgba(107,82,64,0.15);border-radius:16px;padding:2.5rem;width:100%;max-width:480px;box-shadow:0 8px 32px rgba(61,46,34,0.1);}
h1{font-size:20px;font-weight:600;color:#3d2e22;margin-bottom:4px;}
.sub{font-size:13px;color:#8a7060;margin-bottom:2rem;}
.divider{height:1px;background:rgba(107,82,64,0.1);margin:1.5rem 0;}
label{display:block;font-size:13px;color:#6b5240;margin-bottom:6px;font-weight:500;}
input{width:100%;background:#f7f3ee;border:1px solid rgba(107,82,64,0.2);border-radius:8px;padding:11px 14px;font-size:14px;color:#2c1f14;font-family:'Heebo',sans-serif;outline:none;transition:border-color .2s;margin-bottom:1rem;direction:ltr;letter-spacing:1px;}
input:focus{border-color:#6b5240;}
.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:1.5rem;}
.tier-btn{background:#f7f3ee;border:2px solid rgba(107,82,64,0.15);border-radius:10px;padding:12px 8px;text-align:center;cursor:pointer;transition:all .2s;}
.tier-btn:hover{border-color:#6b5240;}
.tier-btn.active{border-color:#c8a96e;background:rgba(200,169,110,0.1);}
.tier-name{font-size:15px;font-weight:600;margin-bottom:3px;}
.tier-clients{font-size:11px;color:#8a7060;}
.btn-generate{width:100%;background:#6b5240;color:#fff;border:none;border-radius:10px;padding:13px;font-size:15px;font-family:'Heebo',sans-serif;cursor:pointer;transition:background .2s;}
.btn-generate:hover{background:#3d2e22;}
.result{margin-top:1.5rem;display:none;}
.result-label{font-size:12px;color:#8a7060;margin-bottom:8px;}
.result-code{background:#f7f3ee;border:2px solid #c8a96e;border-radius:10px;padding:16px;text-align:center;font-size:22px;letter-spacing:4px;color:#3d2e22;font-weight:600;margin-bottom:10px;direction:ltr;cursor:pointer;transition:background .2s;}
.result-code:hover{background:#ede5d8;}
.copy-hint{font-size:12px;color:#8a7060;text-align:center;margin-bottom:10px;}
.tier-badge{display:inline-block;font-size:12px;padding:4px 12px;border-radius:20px;font-weight:500;margin-bottom:6px;}
.wa-btn{display:flex;align-items:center;justify-content:center;gap:8px;background:#25d366;color:#fff;border:none;border-radius:8px;padding:10px;font-size:14px;font-family:'Heebo',sans-serif;cursor:pointer;width:100%;transition:background .2s;}
.wa-btn:hover{background:#1da851;}
.error{color:#c0614a;font-size:13px;margin-top:8px;display:none;}
.copied{color:#7a9e8a;font-size:12px;text-align:center;display:none;}
</style>
</head>
<body>
<div class="card">
  <h1>🔑 יצירת קוד הפעלה</h1>
  <p class="sub">לשימוש פנימי בלבד — מרחב הטיפול</p>

  <div class="divider"></div>

  <label>קוד מחשב של הלקוח (Machine ID)</label>
  <input type="text" id="machine-id" placeholder="XXXX-XXXX-XXXX-XXXX" maxlength="19" oninput="formatMachineId(this)" autocomplete="off">

  <label>בחר מסלול</label>
  <div class="tiers">
    <div class="tier-btn" onclick="selectTier('START')" id="btn-START">
      <div class="tier-name" style="color:#6ab0f5">START</div>
      <div class="tier-clients">עד 10 מטופלים</div>
    </div>
    <div class="tier-btn" onclick="selectTier('PRO')" id="btn-PRO">
      <div class="tier-name" style="color:#c8a96e">PRO</div>
      <div class="tier-clients">עד 40 מטופלים</div>
    </div>
    <div class="tier-btn" onclick="selectTier('UNLIMITED')" id="btn-UNLIMITED">
      <div class="tier-name" style="color:#7a9e8a">UNLIMITED</div>
      <div class="tier-clients">ללא הגבלה</div>
    </div>
  </div>

  <button class="btn-generate" onclick="generate()">צור קוד הפעלה</button>
  <div class="error" id="error"></div>

  <div class="result" id="result">
    <div class="divider"></div>
    <div class="result-label">קוד הפעלה — לחץ להעתקה:</div>
    <div class="result-code" id="result-code" onclick="copyCode()"></div>
    <div class="copied" id="copied">✓ הועתק!</div>
    <div class="copy-hint">לחץ על הקוד להעתקה</div>
    <button class="wa-btn" onclick="sendWhatsApp()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
      שלח קוד בוואטסאפ
    </button>
  </div>
</div>

<script>
const LICENSE_SECRET = 'therapy_license_secret_2025';
let selectedTier = null;
let generatedCode = null;
let currentMachineId = null;

function formatMachineId(input){
  let val = input.value.replace(/[^A-Fa-f0-9]/g,'').toUpperCase();
  let formatted = val.match(/.{1,4}/g)?.join('-') || val;
  input.value = formatted.slice(0,19);
}

function selectTier(tier){
  selectedTier = tier;
  document.querySelectorAll('.tier-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + tier).classList.add('active');
  document.getElementById('result').style.display = 'none';
}

async function hmacSha256(secret, message){
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey('raw', enc.encode(secret), {name:'HMAC',hash:'SHA-256'}, false, ['sign']);
  const sig = await crypto.subtle.sign('HMAC', key, enc.encode(message));
  return Array.from(new Uint8Array(sig)).map(b=>b.toString(16).padStart(2,'0')).join('').toUpperCase();
}

async function generateCode(machineId, tier){
  const cleanId = machineId.replace(/[-\s]/g,'').toUpperCase();
  const hash = (await hmacSha256(LICENSE_SECRET, cleanId + '_' + tier + '_2025')).slice(0,15);
  const prefix = {START:'S', PRO:'P', UNLIMITED:'U'}[tier];
  return (prefix + hash).match(/.{4}/g).join('-');
}

async function generate(){
  const err = document.getElementById('error');
  err.style.display = 'none';
  const mid = document.getElementById('machine-id').value.trim();
  if(!mid || mid.length < 19){ err.textContent = 'נא להזין קוד מחשב תקין (XXXX-XXXX-XXXX-XXXX)'; err.style.display='block'; return; }
  if(!selectedTier){ err.textContent = 'נא לבחור מסלול'; err.style.display='block'; return; }
  generatedCode = await generateCode(mid, selectedTier);
  currentMachineId = mid;
  document.getElementById('result-code').textContent = generatedCode;
  document.getElementById('result').style.display = 'block';
  document.getElementById('copied').style.display = 'none';
}

function copyCode(){
  if(!generatedCode) return;
  navigator.clipboard.writeText(generatedCode).then(()=>{
    document.getElementById('copied').style.display = 'block';
    setTimeout(()=>document.getElementById('copied').style.display='none', 2000);
  });
}

function sendWhatsApp(){
  if(!generatedCode) return;
  const tierLabels = {START:'START (עד 10 מטופלים)', PRO:'PRO (עד 40 מטופלים)', UNLIMITED:'UNLIMITED (ללא הגבלה)'};
  const msg = encodeURIComponent(`שלום,\nהנה קוד ההפעלה שלך למרחב הטיפול גרסת ${tierLabels[selectedTier]}:\n\n${generatedCode}\n\nהזן אותו בתוכנה תחת "קוד הפעלה" ולחץ "הפעל רישיון".`);
  window.open('https://wa.me/?text=' + msg, '_blank');
}
</script>
</body>
</html>
